# ============================================================================
# GENERAL SETTINGS
# ============================================================================

start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
after-login-command = []
after-startup-command = []
on-focus-changed = []
accordion-padding = 0
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
automatically-unhide-macos-hidden-apps = false

# ============================================================================
# GAPS AND PADDING (NO SPACING)
# ============================================================================

[gaps]
inner.horizontal = 0
inner.vertical = 0
outer.left = 2
outer.bottom = 0
outer.top = 0
outer.right = 2

# ============================================================================
# WORKSPACES
# ============================================================================

[workspace-to-monitor-force-assignment]
1 = 'main'
2 = 'main'
3 = 'main'
4 = 'main'
5 = 'main'
6 = 'main'
7 = 'main'
8 = 'main'
9 = 'main'

# ============================================================================
# KEYBOARD SHORTCUTS
# ============================================================================

[mode.main.binding]

# ============================================================================
# FOCUS WINDOWS - Right Alt + Left logical arrows
# ============================================================================

alt-c = ['focus left', 'move-mouse window-lazy-center']
alt-m = ['focus up', 'move-mouse window-lazy-center']
alt-t = ['focus right', 'move-mouse window-lazy-center']
alt-n = ['focus down', 'move-mouse window-lazy-center']

alt-s = ['focus-back-and-forth', 'move-mouse window-lazy-center']

# ============================================================================
# SWAP WINDOWS - Right Alt+Shift + Left hand (CMTN arrows)
# ============================================================================

alt-shift-c = 'swap left'
alt-shift-m = 'swap up'
alt-shift-t = 'swap right'
alt-shift-n = 'swap down'

# ============================================================================
# MOVE WINDOWS - Left Alt + Right hand (AEIO arrows) - NO SHIFT
# ============================================================================

alt-a = 'move left'
alt-shift-quote = 'move up'
alt-i = 'move right'
alt-e = 'move down'

# ============================================================================
# JOIN-WITH WINDOWS - Left Alt+Shift + Right hand (AEIO arrows)
# ============================================================================

alt-shift-a = 'join-with left'
alt-quote = 'join-with up'
alt-shift-i = 'join-with right'
alt-shift-e = 'join-with down'

# ============================================================================
# RESIZE WINDOWS - Left Alt+Shift + Right logical arrows
# ============================================================================

# alt-period = 'resize smart +50'
# alt-u = 'resize smart -50'
# alt-j = 'resize smart-opposite +50'
# alt-y = 'resize smart-opposite -50'

alt-period = 'resize height +50'
alt-u = 'resize height -50'
alt-j = 'resize width +50'
alt-y = 'resize width -50'

# ============================================================================
# LAYOUT OPERATIONS
# ============================================================================

alt-r = 'layout tiles horizontal vertical'
alt-b = 'balance-sizes'
alt-k = 'flatten-workspace-tree'

alt-f = 'fullscreen'
alt-shift-f = 'macos-native-fullscreen'

# ============================================================================
# WORKSPACES - Left Alt + Numbers
# ============================================================================

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

# Quick workspace navigation
alt-tab = 'workspace next'
alt-shift-tab = 'workspace prev'

# ============================================================================
# FLOATING MOVE OPERATIONS
# ============================================================================

alt-g = "exec-and-forget open -g 'hammerspoon://moveWindow?x=150&y=0'"
alt-w = "exec-and-forget open -g 'hammerspoon://moveWindow?x=-150&y=0'"
alt-p = "exec-and-forget open -g 'hammerspoon://moveWindow?y=-150&x=0'"
alt-d = "exec-and-forget open -g 'hammerspoon://moveWindow?y=150&x=0'"

# ============================================================================
# MOVE WINDOW TO WORKSPACE - Left Alt+Shift + Numbers
# ============================================================================

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'

# ============================================================================
# CENTERED WINDOW MODES
# ============================================================================

alt-l = 'layout floating tiling'
alt-x = "exec-and-forget open -g 'hammerspoon://centerWindow?width=0.7&height=1.0'"
alt-v = "exec-and-forget open -g 'hammerspoon://centerWindow?width=0.5&height=1.0'"
alt-z = "exec-and-forget open -g 'hammerspoon://centerWindow?width=0.5&height=0.5'"
# alt-g = [
#     'layout floating',
#     'resize floating width-to 70%',i
#     'resize floating height-to 100%',
#     'move-floating-window horizontal-center',
#     'move-floating-window vertical-center'
# ]
# alt-d = [
#     'layout floating',
#     'resize floating width-to 50%',
#     'resize floating height-to 100%',
#     'move-floating-window horizontal-center',
#     'move-floating-window vertical-center'
# ]

# ============================================================================
# SYSTEM
# ============================================================================

alt-shift-r = 'reload-config'

# ============================================================================
# CLOSE & QUIT WINDOWS
# ============================================================================

alt-q = 'macos-native-minimize'
alt-shift-q = 'close --quit-if-last-window'

# ============================================================================
# APP RULES (floating windows)
# ============================================================================

[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.bitwarden.desktop'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.IdeaPunch.ColorSlurp'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.tidal.desktop'
run = 'layout floating'
