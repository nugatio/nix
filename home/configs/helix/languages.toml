# nb@2026.05.30

# ////////// LATEX (Tectonic + TexLab + Latexindent) //////////

[[language]]
name = "latex"
scope = "source.tex"
injection-regex = "tex"
file-types = ["tex"]
roots = ["Tectonic.toml", ".latexmkrc", ".git"]
language-servers = ["texlab"]
formatter = { command = "latexindent", args = ["-"] }
auto-format = true
soft-wrap = { enable = true }

[language-server.texlab]
command = "texlab"

[language-server.texlab.config.texlab.build]
executable = "tectonic"
args = [
  "-X",
  "compile",
  "%f",
  "--synctex",
  "--keep-logs",
  "--keep-intermediates",
]
onSave = true
forwardSearchAfter = false


# ////////// PYTHON (Ruff + BasedPyright) //////////

[[language]]
name = "python"
scope = "source.python"
injection-regex = "python"
file-types = ["py", "pyi", "py3", "pyw"]
shebangs = ["python"]
roots = [
  "pyproject.toml",
  "setup.py",
  "Poetry.lock",
  "pyrightconfig.json",
  ".git",
]
comment-token = "#"
language-servers = ["basedpyright", "ruff"]
indent = { tab-width = 4, unit = "    " }
auto-format = true

[language-server.basedpyright]
command = "basedpyright-langserver"
args = ["--stdio"]

[language-server.basedpyright.config.basedpyright.analysis]
typeCheckingMode = "standard"
autoImportCompletions = true
diagnosticMode = "openFilesOnly"
inlayHints.variableTypes = true
inlayHints.callArgumentNames = true
inlayHints.functionReturnTypes = true
reportMissingTypeStubs = false

[language-server.ruff]
command = "ruff"
args = ["server", "--preview"]

[language-server.ruff.config.settings]
organizeImports = true


# ////////// ZIG (ZLS) //////////

[[language]]
name = "zig"
auto-format = true
language-servers = ["zls"]

[language-server.zls]
command = "zls"


# ////////// RUST (Rust Analyzer) //////////

[[language]]
name = "rust"
auto-format = true
language-servers = ["rust-analyzer"]

[language-server.rust-analyzer]
command = "rust-analyzer"
config.check.command = "clippy"


# ////////// NIX (Nixd) //////////

[[language]]
name = "nix"
language-servers = ["nixd"]
formatter = { command = "nixpkgs-fmt" }
auto-format = true

[language-server.nixd]
command = "nixd"

[language-server.nixd.config.nixd]
nixpkgs.expr = "import <nixpkgs> {}"
formatting.command = ["nixpkgs-fmt"]


# ////////// MARKDOWN (Markdown Oxide) //////////

[[language]]
name = "markdown"
language-servers = ["markdown-oxide"]
formatter = { command = "prettier", args = ["--parser", "markdown"] }
auto-format = true

[language-server.markdown-oxide]
command = "markdown-oxide"


# ////////// R & JULIA //////////

[[language]]
name = "r"
language-servers = ["r-languageserver"]
auto-format = true

[language-server.r-languageserver]
command = "R"
args = ["--slave", "-e", "languageserver::run()"]

[[language]]
name = "julia"
auto-format = true
language-servers = ["julia"]

[language-server.julia]
command = "julia"
args = [
  "--startup-file=no",
  "--history-file=no",
  "-e",
  "using LanguageServer; runserver()",
]
timeout = 60


# ////////// CONFIGS (TOML / YAML / JSON / HTML / CSS) //////////

[[language]]
name = "toml"
language-servers = ["taplo"]
formatter = { command = "taplo", args = ["fmt", "-"] }
auto-format = true

[[language]]
name = "yaml"
language-servers = ["yaml-language-server"]
formatter = { command = "prettier", args = ["--parser", "yaml"] }
auto-format = true

[[language]]
name = "json"
language-servers = ["vscode-json-language-server"]
formatter = { command = "prettier", args = ["--parser", "json"] }
auto-format = true

[[language]]
name = "html"
language-servers = ["vscode-html-language-server"]
formatter = { command = "prettier", args = ["--parser", "html"] }
auto-format = true

[[language]]
name = "css"
language-servers = ["vscode-css-language-server"]
formatter = { command = "prettier", args = ["--parser", "css"] }
auto-format = true
