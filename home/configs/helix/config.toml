n = "goto_last_modified_file"
l = "goto_next_buffer"
p = "goto_previous_buffer"
"." = "goto_last_modification"
j = "move_line_down"
e = "move_line_up"
w = "goto_word"

# Match mode
[keys.normal.ret]
ret = "match_brackets"
m = "match_brackets"
s = "surround_add"
r = "surround_replace"
d = "surround_delete"
a = "select_textobject_around"
i = "select_textobject_inner"

# View mode
[keys.normal.q]
q = "align_view_center"
c = "align_view_center"
t = "align_view_top"
b = "align_view_bottom"
m = "align_view_middle"
j = "scroll_down"
down = "scroll_down"
k = "scroll_up"
up = "scroll_up"
pageup = "page_down"
pagedown = "page_down"
C-b = "page_up"
C-u = "page_cursor_half_up"
C-d = "page_cursor_half_down"

# Window mode
[keys.normal.S-ret]
w = "rotate_view"
C-w = "rotate_view"
v = "vsplit"
C-v = "vsplit"
s = "hsplit"
C-s = "hsplit"
f = "goto_file"
F = "goto_file"
h = "jump_view_left"
C-h = "jump_view_left"
left = "jump_view_left"
j = "jump_view_down"
C-j = "jump_view_down"
down = "jump_view_down"
k = "jump_view_up"
C-k = "jump_view_up"
up = "jump_view_up"
l = "jump_view_right"
C-l = "jump_view_right"
right = "jump_view_right"
q = "wclose"
C-q = "wclose"
o = "wonly"
C-o = "wonly"
H = "swap_view_left"
J = "swap_view_down"
K = "swap_view_up"
L = "swap_view_right"

# Space mode
[keys.normal.space]
space = "file_picker"
f = "file_picker"
F = "file_picker_in_current_directory"
b = "buffer_picker"
j = "jumplist_picker"
g = "changed_file_picker"
k = "hover"
s = "symbol_picker"
S = "workspace_symbol_picker"
d = "diagnostics_picker"
D = "workspace_diagnostics_picker"
r = "rename_symbol"
a = "code_action"
h = "select_references_to_symbol_under_cursor"
"'" = "last_picker"
w = "no_op"
c = "toggle_comments"
C = "toggle_block_comments"
p = "paste_clipboard_after"
P = "paste_clipboard_before"
y = "yank_to_clipboard"
Y = "yank_main_selection_to_clipboard"
R = "replace_selections_with_clipboard"
"/" = "global_search"
"?" = "command_palette"


# ////////// YAZI FILE PICKER //////////

[keys.normal.space.o]
o = [
  ':sh rm -f /tmp/helix-yazi-chooser',
  ':insert-output yazi "%{buffer_name}" --chooser-file=/tmp/helix-yazi-chooser',
  ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/helix-yazi-chooser}',
  ':redraw',
  ':set mouse false',
  ':set mouse true',
]
v = [
  ':sh rm -f /tmp/helix-yazi-chooser',
  ':insert-output yazi "%{buffer_name}" --chooser-file=/tmp/helix-yazi-chooser',
  ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':vsplit %sh{cat /tmp/helix-yazi-chooser}',
  ':redraw',
  ':set mouse false',
  ':set mouse true',
]
s = [
  ':sh rm -f /tmp/helix-yazi-chooser',
  ':insert-output yazi "%{buffer_name}" --chooser-file=/tmp/helix-yazi-chooser',
  ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':hsplit %sh{cat /tmp/helix-yazi-chooser}',
  ':redraw',
  ':set mouse false',
  ':set mouse true',
]


