# nb@2026.05.30

# ////////// GLOBAL CONFIGURATION //////////

theme = "modern"

[editor]
mouse = false
bufferline = 'multiple'
text-width = 120
trim-final-newlines = true
trim-trailing-whitespace = true
line-number = "relative"
color-modes = true

[editor.lsp]
display-inlay-hints = true
display-messages = true

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.file-picker]
hidden = false

[editor.statusline]
left = ["mode", "separator", "diagnostics", "register", "spinner"]
center = [
  "file-name",
  "file-encoding",
  "file-type",
  "separator",
  "file-modification-indicator",
  "read-only-indicator",
  "version-control",
]
right = ["selections", "separator", "position", "total-line-numbers"]

[editor.cursor-shape]
normal = "block"
insert = "bar"
select = "underline"

[editor.indent-guides]
render = true
character = "┊"
skip-levels = 1


# ////////// NORMAL MODE KEYBINDINGS //////////

[keys.normal]

# :::::::::: NAVIGATION & MOVEMENT (Left Hand) ::::::::::

# Basic movement
c = "move_char_left"
m = "move_line_up"
n = "move_line_down"
t = "move_char_right"

# Line/Page movement
C = "goto_line_start"
M = "page_cursor_half_up"
N = "page_cursor_half_down"
T = "goto_line_end"

Cmd-m = "page_up"
Cmd-n = "page_down"

# Word movement
g = "move_next_word_start"
w = "move_prev_word_start"
k = "move_next_word_end"

# Long word movement
G = "move_next_long_word_start"
W = "move_prev_long_word_start"
K = "move_next_long_word_end"

# Search/Find/Goto
d = "search"
D = "search_selection"
l = "search_next"
L = "search_prev"
p = "find_till_char"
P = "till_prev_char"
s = "goto_line"
S = "goto_file_start"

# Buffer/File Switching
v = "goto_last_accessed_file"
V = "goto_reference"
x = "goto_next_buffer"
X = "goto_previous_buffer"
z = "buffer_picker"
Z = ":buffer-close"

# Utility Commands
"/" = "toggle_comments"
"*" = "format_selections"
"!" = "shell_pipe"
"?" = "command_palette"


# :::::::::: EDITING & SELECTION (Right Hand) ::::::::::

# Insert Modes
"," = "append_mode"
";" = "insert_at_line_end"
a = "insert_mode"
A = "insert_at_line_start"
e = "select_mode"
E = "select_all"

# Command & Macros
r = "command_mode"
R = "repeat_last_motion"
tab = "indent"
S-tab = "unindent"
S-space = "no_op"
S-backspace = "no_op"
Q = "align_view_center"

# History & Clipboard & Text Manipulation
u = "undo"
U = "redo"
i = "yank"
I = "replace"
h = "paste_after"
H = "paste_before"
o = "delete_selection"
O = "collapse_selection"
y = "change_selection"
Y = "replace_with_yanked"
f = "open_below"
F = "open_above"

# Line/Selection Utility
'"' = "extend_line_below"
"'" = "extend_line_above"
':' = "select_register"
j = "join_selections"
J = "join_selections_space"
b = "keep_primary_selection"
B = "no_op"
"#" = "switch_case"
"-" = "increment"
"+" = "decrement"


# :::::::::: MINOR MODES ::::::::::

# Goto mode
[keys.normal.backspace]
g = "goto_file_start"
"|" = "goto_column"
k = "goto_last_line"
f = "goto_file"
c = "goto_line_start"
t = "goto_line_end"
s = "goto_first_nonwhitespace"
h = "goto_window_top"
